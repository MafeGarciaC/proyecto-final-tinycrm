# Load Balancer BD (diagrama: 192.168.2.1 -> aquí 10.1.2.1)
# Galera solo replica, no balancea: este HAProxy reparte las conexiones entre los 3 nodos.

global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    option  tcplog
    # Si no logra conectar con un nodo, reintenta (hasta 3 veces) y lo manda a otro nodo
    retries 3
    option  redispatch
    # Espera máxima para abrir la conexión con un nodo antes de dar error
    timeout connect 5s
    # Tiempo máximo sin actividad del lado del cliente (los backends de TinyCRM)
    timeout client  1m
    # Tiempo máximo esperando respuesta del nodo (consultas largas darían error)
    timeout server  1m

frontend mariadb_front
    bind *:3306
    default_backend galera_cluster

backend galera_cluster
    balance roundrobin
    # Se conecta como haproxy_check y verifica que el nodo responda como MySQL
    option mysql-check user haproxy_check post-41
    # check cada 1s; 2 fallos seguidos = nodo fuera (~2s); 2 éxitos = vuelve a entrar
    # on-marked-down: corta las conexiones que quedaron abiertas hacia un nodo caído
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server galera-1 10.1.2.11:3306 check
    server galera-2 10.1.2.12:3306 check
    server galera-3 10.1.2.13:3306 check

# Página de estado (se ve desde Adminer/curl en la red interna o con docker exec)
listen estadisticas
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
