# Load Balancer de UN cliente (diagrama: Cliente A 192.168.1.6 / Cliente B 192.168.1.7).
# Las IPs llegan por variables de entorno desde apps/cliente-X.env.

global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    # Pasa la IP real del usuario al backend (cabecera X-Forwarded-For)
    option  forwardfor
    timeout connect 5s
    timeout client  1m
    timeout server  1m
    # Si una instancia no acepta la conexión, reintenta en la otra
    retries 3
    option  redispatch

frontend entrada
    bind *:80
    # Para demostrar en la sustentación qué cliente respondió
    http-response set-header X-Cliente "${CLIENTE}"
    use_backend api if { path_beg /api/ }
    default_backend web

# Backends de TinyCRM (Spring Boot)
backend api
    balance roundrobin
    # STICKY SESSION: TinyCRM guarda la sesión en la memoria de cada backend.
    # La primera respuesta pone la cookie SERVERID=app1 o app2 en el navegador y
    # las siguientes peticiones de ese navegador van siempre a la misma instancia.
    cookie SERVERID insert indirect nocache httponly
    # Sano = /api/auth/me responde (401 sin sesión también cuenta como vivo)
    option httpchk GET /api/auth/me
    http-check expect rstatus ^(200|401)$
    default-server inter 2s fall 2 rise 2
    server app1 "${APP1_IP}:8080" check cookie app1
    server app2 "${APP2_IP}:8080" check cookie app2
    # Para demostrar el balanceo: qué instancia respondió
    http-response set-header X-Instancia %[srv_name]

# Frontends (archivos estáticos de Vue), sin sesión: roundrobin simple
backend web
    balance roundrobin
    option httpchk GET /health
    default-server inter 2s fall 2 rise 2
    server web1 "${WEB1_IP}:8080" check
    server web2 "${WEB2_IP}:8080" check

listen estadisticas
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
