# Nginx del frontend de TinyCRM: solo sirve los archivos estáticos de Vue.
# Reemplaza al nginx.conf original, que hacía proxy a "backend:8080" (ahora eso lo hace el LB del cliente).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;

        # Rutas de Vue (SPA)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Archivos con hash en el nombre: se pueden cachear
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health check para el LB
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
